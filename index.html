                            }
                        });
                    }
                });

                return Object.values(s).sort((a, b) => b.totalPoints - a.totalPoints);
            }, [players, filteredChronMatches, metric]);

            const chartData = useMemo(() => {
                let targetMatches = filteredChronMatches;
                if (range !== 'all') targetMatches = filteredChronMatches.slice(-parseInt(range));

                return Array.from({ length: targetMatches.length + 1 }, (_, i) => {
                    const row = { name: `${i}戦` };
                    stats.forEach(p => {
                        const matchIdxInFiltered = filteredChronMatches.length - targetMatches.length + i;
                        const entry = p.history[matchIdxInFiltered] || { val: 0 };
                        row[p.name] = entry.val;
                    });
                    return row;
                });
            }, [stats, filteredChronMatches, range]);

            // プレイヤー選択画面
            if (!selectedPlayerId) {
                return (
                    <div className="p-6 max-w-md mx-auto space-y-6 pb-24">
                        <h2 className="text-2xl font-black">分析</h2>
                        <Card className="p-4 bg-emerald-50 border-emerald-100">
                            <div className="flex gap-2">
                                <Icons.Info size={16} className="text-emerald-500 shrink-0 mt-0.5" />
                                <p className="text-xs text-emerald-800 font-bold">詳細はプレイヤーを選択してください</p>
                            </div>
                        </Card>
                        <div className="grid gap-3">
                            {players.map(p => (
                                <Card key={p.id} className="p-4 flex items-center justify-between cursor-pointer hover:bg-gray-50 active:scale-95 transition-all" onClick={() => setSelectedPlayerId(p.id)}>
                                    <div className="flex items-center gap-3">
                                        <div className="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 font-black">
                                            {p.name.slice(0, 2)}
                                        </div>
                                        <div>
                                            <div className="font-bold text-lg">{p.name}</div>
                                            <div className="text-[10px] text-gray-400 font-bold">通算 {stats.find(s => s.id === p.id)?.count || 0} 戦</div>
                                        </div>
                                    </div>
                                    <Icons.ChevronRight size={20} className="text-gray-300" />
                                </Card>
                            ))}
                        </div>
                    </div>
                );
            }

            // 個別詳細画面
            const targetStat = stats.find(s => s.id === selectedPlayerId);
            if (!targetStat) return <div className="p-4">プレイヤーデータが見つかりません <Button onClick={() => setSelectedPlayerId(null)}>戻る</Button></div>;

            const yakuRanking = Object.entries(targetStat.yaku).sort((a, b) => b[1] - a[1]).slice(0, 10);
            const yakuPieData = yakuRanking.map(([name, count], i) => ({
                name,
                value: count,
                color: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#06b6d4', '#84cc16', '#f97316', '#6366f1'][i % 10]
            }));

            return (
                <div className="p-4 space-y-6 max-w-4xl mx-auto pb-32">
                    <div className="flex items-center gap-2 mb-4">
                        <Button variant="ghost" size="sm" onClick={() => setSelectedPlayerId(null)}>
                            <Icons.ChevronLeft size={16} /> 一覧へ
                        </Button>
                        <h2 className="text-xl font-black">{targetStat.name}の分析</h2>
                    </div>

                    <div className="flex justify-end gap-2 mb-2">
                        <select className="text-[10px] border rounded font-bold px-1" value={period} onChange={e => setPeriod(e.target.value)}>
                            <option value="all">全期間</option>
                            <option value="month">今月</option>
                            <option value="year">今年</option>
                        </select>
                        <select className="text-[10px] border rounded font-bold px-1" value={metric} onChange={e => setMetric(e.target.value)}>
                            <option value="points">収支</option>
                            <option value="rank">平均順位</option>
                        </select>
                        <select className="text-[10px] border rounded font-bold px-1" value={range} onChange={e => setRange(e.target.value)}>
                            <option value="all">全表示</option>
                            <option value="10">直近10戦</option>
                            <option value="5">直近5戦</option>
                        </select>
                    </div>

                    <Card className="h-64 p-2 bg-white flex flex-col shadow-sm">
                        <div className="flex justify-between items-center mb-2 px-1">
                            <span className="text-[10px] font-bold text-gray-400">{metric === 'points' ? '累積収支推移' : '平均順位推移'}</span>
                            <div className="flex gap-2 items-center text-[8px] text-gray-400 font-bold">
                                <Icons.TrendingUp size={10} /> Trend
                            </div>
                        </div>
                        {chartData.length > 1 && stats.length > 0 && ResponsiveContainer && LineChart ? (
                            <ResponsiveContainer width="100%" height="100%">
                                <LineChart data={chartData}>
                                    <CartesianGrid strokeOpacity={0.05} vertical={false} />
                                    <XAxis hide dataKey="name" />
                                    <YAxis fontSize={8} reversed={metric === 'rank'} tickFormatter={v => metric === 'points' && v > 0 ? `+${v}` : v} />
                                    <ChartTooltip contentStyle={{ fontSize: '10px', borderRadius: '12px', border: 'none', boxShadow: '0 8px 24px rgba(0,0,0,0.1)' }} />
                                    <Legend iconType="circle" wrapperStyle={{ fontSize: '9px', paddingTop: '10px' }} />
                                    {/* 選択されたプレイヤーのみ太く表示、他は薄く表示 */}
                                    {stats.map((p, i) => (
                                        <Line
                                            key={p.id}
                                            type="monotone"
                                            dataKey={p.name}
                                            stroke={p.id === selectedPlayerId ? '#10b981' : '#e5e7eb'}
                                            strokeWidth={p.id === selectedPlayerId ? 3 : 1}
                                            dot={p.id === selectedPlayerId ? { r: 3 } : false}
                                            activeDot={{ r: 5 }}
                                            animationDuration={1000}
                                            // 他プレイヤーのラインは目立たなくする
                                            strokeOpacity={p.id === selectedPlayerId ? 1 : 0.3}
                                            zIndex={p.id === selectedPlayerId ? 10 : 0}
                                        />
                                    ))}
                                </LineChart>
                            </ResponsiveContainer>
                        ) : (
                            <div className="flex-1 flex items-center justify-center text-gray-300 text-sm font-bold">
                                対局データがありません
                            </div>
                        )}
                    </Card>

                    <div className="grid gap-4 md:grid-cols-2">
                        {/* 基本スタッツ */}
                        <Card className="space-y-4 p-4">
                            <h3 className="text-sm font-bold flex items-center gap-2"><Icons.Activity size={16} /> スタッツ</h3>
                            <div className="grid grid-cols-2 gap-4">
                                <div className="text-center p-2 bg-gray-50 rounded">
                                    <div className="text-xs text-gray-500 mb-1">平均順位</div>
                                    <div className="text-xl font-black text-emerald-600">{(targetStat.ranks.length ? targetStat.ranks.reduce((a, b) => a + b, 0) / targetStat.ranks.length : 0).toFixed(2)}</div>
                                </div>
                                <div className="text-center p-2 bg-gray-50 rounded">
                                    <div className="text-xs text-gray-500 mb-1">トップ率</div>
                                    <div className="text-xl font-black text-blue-600">{(targetStat.ranks.filter(r => r === 1).length / (targetStat.count || 1) * 100).toFixed(1)}%</div>
                                </div>
                                <div className="text-center p-2 bg-gray-50 rounded">
                                    <div className="text-xs text-gray-500 mb-1">平均素点</div>
                                    <div className="text-xl font-black">{Math.round(targetStat.totalScore / (targetStat.count || 1)).toLocaleString()}</div>
                                </div>
                                <div className="text-center p-2 bg-gray-50 rounded">
                                    <div className="text-xs text-gray-500 mb-1">平均収支</div>
                                    <div className="text-xl font-black">{(targetStat.totalPoints / (targetStat.count || 1)).toFixed(1)}</div>
                                </div>
                            </div>
                        </Card>

                        {/* 最高打点 */}
                        <Card className="p-4 bg-gradient-to-br from-amber-50 to-amber-100">
                            <div className="text-[10px] font-bold text-amber-500 mb-2 flex items-center gap-1">
                                <Icons.Trophy size={12} />最高打点の手
                            </div>
                            {targetStat.highestHand ? (
                                <div className="space-y-1">
                                    <div className="text-lg font-black text-amber-700">
                                        {parseInt(targetStat.highestHand.points).toLocaleString()}点
                                    </div>
                                    <div className="flex flex-wrap gap-1">
                                        {(targetStat.highestHand.yaku || []).slice(0, 3).map(y => (
                                            <span key={y} className="bg-white px-1.5 py-0.5 rounded text-[7px] font-bold text-amber-600 border border-amber-200">{y}</span>
                                        ))}
                                        {(targetStat.highestHand.yaku || []).length > 3 && (
                                            <span className="text-[8px] text-amber-400">+{targetStat.highestHand.yaku.length - 3}</span>
                                        )}
                                    </div>
                                    <div className="text-[8px] text-amber-400">{new Date(targetStat.highestHand.date).toLocaleDateString()}</div>
                                </div>
                            ) : (
                                <div className="text-[10px] text-amber-400">データなし</div>
                            )}
                        </Card>
                    </div>

                    <div className="grid gap-4 md:grid-cols-2">
                        {/* 順位分布 */}
                        <Card className="p-4 space-y-4">
                            <h3 className="text-sm font-bold flex items-center gap-2"><Icons.BarChart3 size={16} /> 順位分布</h3>
                            <div className="h-48">
                                <ResponsiveContainer width="100%" height="100%">
                                    <BarChart data={[{ name: targetStat.name, range1: targetStat.rankDist[1], range2: targetStat.rankDist[2], range3: targetStat.rankDist[3], range4: targetStat.rankDist[4] }]}>
                                        <CartesianGrid strokeDasharray="3 3" vertical={false} />
                                        <XAxis dataKey="name" fontSize={8} />
                                        <YAxis fontSize={8} />
                                        <ChartTooltip />
                                        <Bar dataKey="range1" name="1位" fill="#10b981" radius={[4, 4, 0, 0]} />
                                        <Bar dataKey="range2" name="2位" fill="#3b82f6" radius={[4, 4, 0, 0]} />
                                        <Bar dataKey="range3" name="3位" fill="#f59e0b" radius={[4, 4, 0, 0]} />
                                        <Bar dataKey="range4" name="4位" fill="#ef4444" radius={[4, 4, 0, 0]} />
                                    </BarChart>
                                </ResponsiveContainer>
                            </div>
                        </Card>

                        {/* 役頻度 */}
                        <Card className="p-4 space-y-4">
                            <h3 className="text-sm font-bold flex items-center gap-2"><Icons.PieChart size={16} /> 役傾向</h3>
                            {yakuPieData.length > 0 ? (
                                <div className="flex items-center">
                                    <div className="h-32 w-32 shrink-0">
                                        <ResponsiveContainer width="100%" height="100%">
                                            <PieChart>
                                                <Pie data={yakuPieData} cx="50%" cy="50%" innerRadius={25} outerRadius={45} paddingAngle={2} dataKey="value">
                                                    {yakuPieData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                                                </Pie>
                                            </PieChart>
                                        </ResponsiveContainer>
                                    </div>
                                    <div className="flex-1 pl-4 h-32 overflow-y-auto custom-scrollbar">
                                        {yakuRanking.map(([name, count], i) => (
                                            <div key={name} className="flex justify-between items-center text-[10px] mb-1">
                                                <div className="flex items-center gap-1">
                                                    <div className="w-2 h-2 rounded-full" style={{ backgroundColor: yakuPieData[i].color }}></div>
                                                    <span>{name}</span>
                                                </div>
                                                <span className="font-bold">{count}回</span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            ) : (
                                <div className="text-center text-gray-400 text-xs py-8">データなし</div>
                            )}
                        </Card>
                    </div>
                </div>
            );
        };

        const SettingsView = () => {
            const { currentGroupId, groups, updateGroupRules, navigate, leaveGroup } = useStore();
            const group = groups[currentGroupId];

            if (!group) return null;

            return (
                <div className="p-4 space-y-6 max-w-2xl mx-auto pb-32">
                    <h2 className="text-xl font-black">グループ設定</h2>

                    <section className="space-y-3">
                        <div className="flex items-center gap-2 mb-2">
                            <Settings size={18} className="text-gray-400" />
                            <h3 className="font-bold text-sm">基本ルール設定</h3>
                        </div>
                        <Card className="p-4">
                            <RuleForm
                                initialRules={group.rules}
                                onSubmit={(newRules) => {
                                    updateGroupRules(currentGroupId, newRules);
                                    alert("ルールを更新しました");
                                }}
                                submitLabel="ルールを保存"
                            />
                        </Card>
                    </section>

                    <section className="space-y-3">
                        <div className="flex items-center gap-2 mb-2">
                            <Icons.CloudUpload size={18} className="text-emerald-500" />
                            <h3 className="font-bold text-sm">クラウド移行 (New)</h3>
                        </div>
                        <Card className="p-4 border-emerald-100 bg-emerald-50/30">
                            <div className="space-y-4">
                                <p className="text-[10px] text-gray-500 leading-relaxed font-medium">
                                    現在ブラウザに保存されているデータを、新しいクラウドデータベースへアップロードします。
                                </p>
                                <Button className="w-full h-12" onClick={async () => {
                                    if (!confirm("現在のデータをクラウドへ移行しますか？\n（Next.js版アプリへデータを引き継ぎます）")) return;

                                    try {
                                        const firebaseConfig = {
                                            apiKey: "9cd51b93f21a2451d7c29342db55cb18842b76df",
                                            authDomain: "mahjong@mahjongstorage-836e8.iam.gserviceaccount.com",
                                            projectId: "mahjongstorage-836e8",
                                            storageBucket: "your_project_id.appspot.com",
                                            messagingSenderId: "618604764916",
                                            appId: "1:618604764916:web:9ca128c3e76a7cb3e248a"
                                        };

                                        if (!firebase.apps.length) {
                                            firebase.initializeApp(firebaseConfig);
                                        }
                                        const db = firebase.firestore();

                                        const rawData = localStorage.getItem('mahjong-tracker-storage');
                                        if (!rawData) {
                                            alert("移行するデータが見つかりません。");
                                            return;
                                        }
                                        const data = JSON.parse(rawData);

                                        // 1. Groups
                                        const groupPromises = Object.values(data.groups || {}).map(async (group) => {
                                            await db.collection('groups').doc(group.id).set(group);

                                            // 2. Players for this group
                                            const groupPlayers = Object.values(data.players || {}).filter(p => p.groupId === group.id);
                                            for (const player of groupPlayers) {
                                                await db.collection('groups').doc(group.id).collection('players').doc(player.id).set(player);
                                            }

                                            // 3. Matches for this group
                                            const groupMatches = Object.values(data.matches || {}).filter(m => m.groupId === group.id);
                                            for (const match of groupMatches) {
                                                await db.collection('groups').doc(group.id).collection('matches').doc(match.id).set(match);
                                            }
                                        });

                                        await Promise.all(groupPromises);
                                        alert("クラウドへの移行が完了しました！\nNext.js版アプリを開いて確認してください。");

                                    } catch (e) {
                                        console.error(e);
                                        alert("移行に失敗しました: " + e.message);
                                    }
                                }}>今すぐデータを移行する</Button>
                            </div>
                        </Card>
                    </section>

                    <section className="space-y-3">
                        <div className="flex items-center gap-2 mb-2">
                            <LogIn size={18} className="text-blue-400 rotate-180" />
                            <h3 className="font-bold text-sm">グループ管理</h3>
                        </div>
                        <Card className="p-4 border-blue-100 bg-blue-50/30">
                            <div className="space-y-4">
                                <p className="text-[10px] text-gray-500 leading-relaxed font-medium">
                                    現在のグループから一時的に抜けます。データは保持され、再度参加できます。
                                </p>
                                <Button
                                    variant="outline"
                                    className="w-full text-blue-600 border-blue-200 hover:bg-blue-50"
                                    onClick={() => {
                                        if (confirm("グループから抜けますか？")) {
                                            leaveGroup();
                                        }
                                    }}
                                >
                                    グループから抜ける
                                </Button>
                            </div>
                        </Card>
                    </section>

                    <section className="space-y-3">
                        <div className="flex items-center gap-2 mb-2">
                            <AlertCircle size={18} className="text-red-400" />
                            <h3 className="font-bold text-sm text-red-500">デッド操作</h3>
                        </div>
                        <Card className="p-4 border-red-100 bg-red-50/30">
                            <div className="space-y-4">
                                <p className="text-[10px] text-gray-500 leading-relaxed font-medium">データを削除すると元に戻せません。このグループのすべての対局記録が消去されます。</p>
                                <Button variant="outline" className="w-full text-red-500 border-red-200 hover:bg-red-50" onClick={() => {
                                    if (confirm("全てのデータをリセットしますか？この操作は取り消せません。")) {
                                        localStorage.removeItem('mahjong-tracker-storage');
                                        window.location.reload();
                                    }
                                }}>全てのデータをリセット</Button>
                            </div>
                        </Card>
                    </section>

                    <Button variant="secondary" className="w-full h-12" onClick={() => navigate('dashboard')}>戻る</Button>

                    {/* Debug Info Footer */}
                    <div className="mt-8 pt-4 border-t border-gray-200 text-[10px] text-gray-400 font-mono text-center">
                        <p>App ID: {firebaseConfig.projectId}</p>
                        <p>Auth Status: {isAuthenticated ? `Logged In (${firebase.auth().currentUser?.uid?.slice(0, 6)}...)` : 'Not Logged In'}</p>
                        <p>Current Group: {group?.id ? group.id.slice(0, 8) + '...' : 'None'}</p>
                    </div>
                </div>
            );
        };

        const App = () => {
            const { currentGroupId, currentView } = useStore();
            const view = currentView || (currentGroupId ? 'dashboard' : 'onboarding');
            return (
                <Layout hideNav={view === 'onboarding'}>
                    {view === 'onboarding' && <OnboardingView />}
                    {view === 'dashboard' && <DashboardView />}
                    {view === 'newMatch' && <NewMatchView />}
                    {view === 'history' && <HistoryView />}
                    {view === 'analytics' && <AnalyticsView />}
                    {view === 'settings' && <SettingsView />}
                </Layout>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<AppProvider><App /></AppProvider>);
    </script>
</body>

</html>
